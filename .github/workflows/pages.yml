name: AI Arena CI / Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Least privilege: the workflow-level token is read-only. `pages: write` + `id-token: write`
# are granted to the deploy job only, so validate / browser-smoke (which also run on PRs)
# never hold deployment-capable credentials.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# Every action is pinned to a full-length commit SHA (supply-chain hardening: a moving tag
# can be re-pointed, a SHA cannot). The trailing `# vX.Y.Z` comment records the release the
# SHA was resolved from; Dependabot (github-actions ecosystem) bumps the SHA and the comment together.
# Runner OS is an explicit, GA image label (`ubuntu-26.04`; runner-images #14747), never the rolling
# `ubuntu-latest` alias (which migrates to 26.04 in Nov 2026, #14748): the OS is a reproducibility
# input, so a major change must show up as a repo diff instead of happening under the same commit.
# Not a private image build number — GitHub still rolls patch images underneath the label.
jobs:
  # Run on every PR and push: verify manifest sync and scan for secrets.
  validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node is pinned to an exact patch (Owner decision 2026-10-27, after the Node.js 2026-10-21
      # security release) from ONE repo-owned source: `.node-version` (consumed by all three jobs via
      # `node-version-file`; test/ci-config.test.mjs CI-1/CI-2 enforce single source + the approved 22 line).
      # With a major-only range (`"22"`) the hosted toolcache lags new patches, and `check-latest` would let
      # the same commit run a different Node patch without a repo diff; with an exact pin `check-latest`
      # can only re-resolve the same version, so it stays at its default. Dependabot does NOT bump the pin —
      # the weekly read-only `node-pin-check.yml` fails when the pin is behind its line (patch-drift) or the
      # line is EOL (major-line-migration); fix = edit `.node-version` in a PR.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      - name: Generate task manifest
        run: node scripts/build-manifest.mjs --strict

      - name: Verify generated manifest is committed
        run: |
          if ! git diff --exit-code -- tasks.json; then
            echo "::error file=tasks.json::tasks.json is out of sync. Run node scripts/build-manifest.mjs and commit the regenerated file."
            exit 1
          fi

      - name: Scan submissions for secrets
        run: node scripts/scan-secrets.mjs

      # Zero-dep node:test over every test/*.test.mjs: Any/Explicit-Subset filter + sort logic
      # (filter-core), the Model Family registry (model-registry), the closed-world publication
      # regression suite (publication — P-1a/1b, P-2..P-5, N-1..N-12, HM-1..HM-4), the model-viewer SRI
      # oracle (model-viewer-sri — SRI-1..6), and the CI-config contracts (ci-config — CI-1..6,
      # node-pin-check — NP-1..7). The glob test/*.test.mjs is required: a directory arg
      # (`node --test test/`) is NOT searched by the runner here.
      - name: Run unit tests (filter-core, model-registry, publication, model-viewer-sri, ci-config)
        run: node --test test/*.test.mjs

      # WS5-A Packet A: fail-closed closed-world publication gate at the PR layer. Assembles to a
      # temp dir WITHOUT deploying. The assembler's OWN fail-closed enumeration + assets-closed-set
      # reject extra assets, folder-external strays, symlinks (including a symlinked tasks/ or assets/
      # root) and non-regular files on the PR itself (not merged-then-broken-deploy); the post-assembly
      # set comparison ADDITIONALLY verifies assembler fidelity (output == expected), NOT source
      # cleanliness (A-13). `build-manifest.mjs --strict` (above) is the first fail-closed source gate.
      # Deploy runs the same assembler for real (below).
      - name: Verify closed-world publication set (assemble-site --check)
        run: node scripts/assemble-site.mjs --check

  # Browser-only regression contracts that DOM-free unit tests cannot honestly prove:
  # 320px responsive overflow, placeholder :focus-visible clipping, rendered filter /
  # sort ARIA, focus guard, and moveBefore iframe-state preservation. Chromium only;
  # the site stays dependency-free at runtime (Playwright is test infra). The static
  # site is served by the zero-dep test/browser/static-server.mjs (Playwright webServer).
  browser-smoke:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium only
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        run: npx playwright test

  # Deploy only on pushes to main or manual runs. PRs, including forks, do not deploy.
  # Gated on `validate` only: browser-smoke runs on every PR and push as a required signal,
  # but a transient Chromium/npm/system-dependency failure must not block publishing a valid
  # static site (the merged code already passed browser-smoke on its PR).
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-26.04
    # The only job that needs deployment credentials (see the workflow-level permissions note).
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate task manifest
        run: node scripts/build-manifest.mjs --strict

      # Closed-world assembler (WS5-A Packet A) replaces the prior `cp -R index.html assets tasks
      # tasks.json _site/`. Publishes exactly the 407-file set derived from the PHYSICAL validated tree
      # (folder names, never manifest ids) plus the chrome list (byte-identical to the old cp -R on a
      # clean checkout; P-1a/P-1b); fails closed on strays/symlinks/non-regular/traversal, and aborts
      # the deploy (non-zero) before upload if the set does not verify.
      - name: Build static site (closed-world assembler)
        run: node scripts/assemble-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000

      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000
