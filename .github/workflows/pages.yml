name: AI Arena CI / Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run on every PR and push: verify manifest sync and scan for secrets.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Generate task manifest
        run: node scripts/build-manifest.mjs --strict

      - name: Verify generated manifest is committed
        run: |
          if ! git diff --exit-code -- tasks.json; then
            echo "::error file=tasks.json::tasks.json is out of sync. Run node scripts/build-manifest.mjs and commit the regenerated file."
            exit 1
          fi

      - name: Scan submissions for secrets
        run: node scripts/scan-secrets.mjs

      # Pure Any/Explicit-Subset filter + sort logic (assets/filter-core.mjs).
      # Node 22 built-in runner, zero deps, no package.json. A directory arg
      # (`node --test test/`) is not searched by the runner here, so the test
      # files are passed explicitly via the glob.
      - name: Run filter-core logic tests
        run: node --test test/*.test.mjs

  # Browser-only regression contracts that DOM-free unit tests cannot honestly prove:
  # 320px responsive overflow, placeholder :focus-visible clipping, rendered filter /
  # sort ARIA, focus guard, and moveBefore iframe-state preservation. Chromium only;
  # the site stays dependency-free at runtime (Playwright is test infra). The static
  # site is served by the zero-dep test/browser/static-server.mjs (Playwright webServer).
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium only
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        run: npx playwright test

  # Deploy only on pushes to main or manual runs. PRs, including forks, do not deploy.
  # Gated on `validate` only: browser-smoke runs on every PR and push as a required signal,
  # but a transient Chromium/npm/system-dependency failure must not block publishing a valid
  # static site (the merged code already passed browser-smoke on its PR).
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Generate task manifest
        run: node scripts/build-manifest.mjs --strict

      - name: Build static site
        run: |
          mkdir -p _site
          cp -R index.html assets tasks tasks.json _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000

      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000
