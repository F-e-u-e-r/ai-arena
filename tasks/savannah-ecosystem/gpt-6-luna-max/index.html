<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3d4f48" />
    <title>Field Notes — Savannah Ecosystem</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app" aria-label="Interactive African savannah ecosystem">
      <section class="scene" aria-label="Animated savannah">
        <canvas id="savannah" role="img" aria-label="A living savannah with lions, elephants, leopards, changing seasons and weather"></canvas>
        <header class="scene-heading">
          <div class="brand-lockup">
            <span class="brand-mark" aria-hidden="true">✳</span>
            <div>
              <h1>FIELD NOTES <span> / SAVANNA</span></h1>
              <p class="brand-caption">A living landscape, in miniature</p>
            </div>
          </div>
          <div class="season-readout" aria-live="polite">
            <span class="readout-dot" aria-hidden="true"></span>
            <span id="season-readout">DRY SEASON</span>
          </div>
        </header>
        <div class="scene-caption" aria-hidden="true">
          <span class="caption-line"></span>
          <span id="weather-caption">GOLDEN HOUR · OPEN PLAINS</span>
        </div>
      </section>

      <footer class="control-deck" aria-label="Ecosystem controls">
        <div class="weather-controls" role="group" aria-label="Select weather">
          <button class="weather-button is-active" type="button" data-weather="sunny" aria-label="Sunny weather" aria-pressed="true" title="Sunny weather (1)">
            <span class="weather-icon" aria-hidden="true">☀</span><span class="weather-name">Sunny</span>
          </button>
          <button class="weather-button" type="button" data-weather="rain" aria-label="Rain" aria-pressed="false" title="Rain (2)">
            <span class="weather-icon" aria-hidden="true">☂</span><span class="weather-name">Rain</span>
          </button>
          <button class="weather-button" type="button" data-weather="heavyRain" aria-label="Heavy rain" aria-pressed="false" title="Heavy rain (3)">
            <span class="weather-icon" aria-hidden="true">⛈</span><span class="weather-name">Heavy</span>
          </button>
          <button class="weather-button" type="button" data-weather="snow" aria-label="Snow" aria-pressed="false" title="Snow (4)">
            <span class="weather-icon" aria-hidden="true">❄</span><span class="weather-name">Snow</span>
          </button>
          <button class="weather-button" type="button" data-weather="thunderstorm" aria-label="Thunderstorm" aria-pressed="false" title="Thunderstorm (5)">
            <span class="weather-icon" aria-hidden="true">ϟ</span><span class="weather-name">Storm</span>
          </button>
          <button class="weather-button" type="button" data-weather="tornado" aria-label="Tornado" aria-pressed="false" title="Tornado (6)">
            <span class="weather-icon" aria-hidden="true">🌀</span><span class="weather-name">Tornado</span>
          </button>
        </div>
        <button class="season-button" id="season-toggle" type="button" title="Toggle season (S)" aria-label="Toggle season">
          <span class="season-icon" aria-hidden="true">◒</span>
          <span id="season-button-label">DRY</span>
          <span class="switch-glyph" aria-hidden="true">↻</span>
        </button>
      </footer>
    </main>
    <script src="main.js"></script>
  </body>
</html>
