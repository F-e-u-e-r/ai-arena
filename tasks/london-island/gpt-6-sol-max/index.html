<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9bbbd9" />
    <title>Little London — Four Seasons Above the Clouds</title>
    <meta name="description" content="A floating miniature London with four seasons, changing weather, and a fifteen-second day and night cycle." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app" class="app" aria-label="Interactive floating London scene">
      <div id="scene" class="scene" aria-label="Drag left or right to orbit the 3D island"></div>

      <header class="masthead">
        <div class="brand" aria-label="Little London">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <div>
            <p class="eyebrow">A TINY WORLD ABOVE THE CLOUDS</p>
            <h1>Little <em>London</em></h1>
          </div>
        </div>
        <div class="top-actions">
          <div class="cycle-readout" aria-live="off">
            <span class="cycle-indicator" id="cycle-indicator" aria-hidden="true">☀</span>
            <span class="cycle-copy"><strong id="time-label">DAYLIGHT</strong><small>15s sky cycle</small></span>
          </div>
          <button class="round-button" id="time-toggle" type="button" aria-label="Switch to night" title="Switch day or night (N)">
            <span id="time-toggle-icon" aria-hidden="true">☾</span>
          </button>
        </div>
      </header>

      <div class="scene-note" aria-hidden="true">
        <span class="note-line"></span>
        <span>DRAG TO EXPLORE</span>
      </div>

      <aside class="season-card" aria-live="polite">
        <span class="season-card-kicker">NOW IN LONDON</span>
        <strong id="season-title">Spring</strong>
        <span id="season-description">A little morning mist</span>
      </aside>

      <nav class="season-dock" aria-label="Choose a season">
        <button class="season-button is-active" type="button" data-season="0" aria-label="Spring" aria-pressed="true" title="Spring (1)">
          <span class="season-icon" aria-hidden="true">✿</span><span class="season-name">Spring</span>
        </button>
        <button class="season-button" type="button" data-season="1" aria-label="Summer" aria-pressed="false" title="Summer (2)">
          <span class="season-icon" aria-hidden="true">☀</span><span class="season-name">Summer</span>
        </button>
        <button class="season-button" type="button" data-season="2" aria-label="Autumn" aria-pressed="false" title="Autumn (3)">
          <span class="season-icon" aria-hidden="true">❧</span><span class="season-name">Autumn</span>
        </button>
        <button class="season-button" type="button" data-season="3" aria-label="Winter" aria-pressed="false" title="Winter (4)">
          <span class="season-icon" aria-hidden="true">❄</span><span class="season-name">Winter</span>
        </button>
      </nav>

      <div class="debug" id="debug" hidden>FPS <span id="fps">--</span> · PARTICLES <span id="particles">0</span></div>
      <div class="load-error" id="load-error" hidden>Three.js could not load. Please check your internet connection and reopen this page.</div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
